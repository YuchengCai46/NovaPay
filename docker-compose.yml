version: "3.8"
services:
  novapay:
    build: .
    container_name: novapay
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:////app/data/novapay.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-secret}
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:-change-me-32-byte-aes-key!!!}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - FLASK_DEBUG=false
      - SECURE_COOKIE=true
    volumes:
      - novapay-data:/app/data
      - novapay-logs:/app/logs
    restart: unless-stopped

volumes:
  novapay-data:
  novapay-logs:
